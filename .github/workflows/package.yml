name: Build native test packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            artifact: windows-x64
          - os: macos-15-intel
            architecture: x64
            artifact: macos-x64
          - os: macos-15
            architecture: aarch64
            artifact: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          architecture: ${{ matrix.architecture }}
          cache: maven
      - name: Verify
        shell: bash
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Install WiX 3
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package.ps1 -PackageType exe
      - name: macOS package
        if: runner.os == 'macOS'
        run: ./scripts/package.sh dmg
      - uses: actions/upload-artifact@v4
        with:
          name: naehplan-test-${{ matrix.artifact }}
          path: target/dist/*
          if-no-files-found: error
