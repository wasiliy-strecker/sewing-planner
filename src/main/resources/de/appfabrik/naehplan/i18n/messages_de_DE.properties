privacy.date=Stand: 31. Oktober 2026
privacy.body=Verantwortlicher und Kontakt\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburg, Deutschland\nDatenschutz: contact@appfabrik-ai.de\nSupport: support@appfabrik-ai.de\n\nZweck und gespeicherte Daten\nNähPlan verwaltet deine Nähprojekte. Gespeichert werden Projektname, Material, Farbe, Aufbewahrungsort, Notiz, ein optionales Foto und der Projektstatus sowie die Texte, Reihenfolge und Erledigt-Markierungen deiner Arbeitsschritte. Diese Daten, interne Eintragskennungen und deine Spracheinstellung liegen standardmäßig lokal im Benutzerprofil deines Computers. Texte und Fotos können personenbezogene Informationen enthalten. Die Verarbeitung dient den von dir angeforderten Funktionen zur Verwaltung und Suche.\n\nLokale Verarbeitung\nDie App benötigt kein Konto und keinen Server. Sie sendet deine Daten und Spracheinstellung nicht an den Entwickler oder andere Empfänger. Sie enthält keine Werbung, Telemetrie, Nutzungsanalyse oder eigene Cloud-Synchronisierung. Diese Erklärung ist offline in der App enthalten. Die App verschlüsselt ihre lokalen Daten nicht selbst. Der Schutz hängt auch von deinem Benutzerkonto, Zugriffsrechten und einer gegebenenfalls aktivierten Datenträgerverschlüsselung ab.\n\nFotos und Sicherungskopien\nDie App liest nur das von dir ausgewählte JPEG- oder PNG-Bild und speichert eine Kopie in der lokalen Datenbank. Sie verändert oder löscht die Originaldatei nicht. Vorhandene Bildmetadaten können in der gespeicherten Kopie enthalten bleiben. Wenn du den Datenordner sicherst oder auf einem synchronisierten Ordner oder Netzlaufwerk speicherst, können die jeweiligen Dienste Daten außerhalb der App verarbeiten. Dafür gelten deren Einstellungen und Datenschutzbedingungen. Die App steuert diese Dienste nicht.\n\nSpeicherdauer und Löschung\nDie Daten bleiben gespeichert, bis du Einträge löschst oder die lokalen App-Daten entfernst. Du kannst Einträge in der App ansehen, bearbeiten und löschen. Zum Entfernen aller lokalen Daten einschließlich Fotos und Spracheinstellung schließt du die App und entfernst ihren Datenordner. Die Speicherorte stehen in der mitgelieferten Anleitung. Originalfotos und Sicherungskopien musst du gesondert löschen. Das Löschen eines Eintrags garantiert keine sichere Löschung früherer Dateiinhalte. Verlasse dich nicht darauf, dass eine Deinstallation alle App-Daten und externen Kopien entfernt.\n\nKontakt und Support\nWenn du uns freiwillig eine E-Mail sendest, verarbeiten wir deine E-Mail-Adresse, den Nachrichteninhalt und beigefügte Dateien zur Bearbeitung der Anfrage. Deine lokal gespeicherte Sammlung wird dabei nicht automatisch mitgesendet. Rechtsgrundlage ist bei vertragsbezogenen Anfragen Artikel 6 Absatz 1 Buchstabe b DSGVO, ansonsten unser berechtigtes Interesse an der Beantwortung von Anfragen nach Artikel 6 Absatz 1 Buchstabe f DSGVO. Wir bewahren die Korrespondenz nur so lange auf, wie dies für die Bearbeitung und gesetzliche Aufbewahrungspflichten erforderlich ist.\n\nDeine Rechte und weitere Anbieter\nSoweit anwendbar, hast du Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit und Widerspruch sowie das Recht auf Beschwerde bei einer Datenschutzaufsichtsbehörde. Nutze dafür den Datenschutzkontakt. Auf Sammlungen, die ausschließlich auf deinem Computer liegen, hat der Entwickler keinen Zugriff. Beim Bezug oder Aktualisieren über Microsoft Store oder GitHub können diese Anbieter selbst Daten verarbeiten. Dafür gelten deren eigene Datenschutzbedingungen. Diese Erklärung beschreibt die Datenverarbeitung durch NähPlan und wird bei entsprechenden Änderungen aktualisiert.
