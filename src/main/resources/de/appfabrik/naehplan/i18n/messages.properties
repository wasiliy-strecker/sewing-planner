privacy.export=Collection export (including project status and checklist steps)\nYou can export all saved entries, selected color values and photos to a JSON file at a location you choose. The stored photo copies are included in full, with any metadata they still contain. The file is not encrypted. The app does not upload or send it. If you save it in a cloud or network folder, that provider may process it. Sharing and deleting exported copies is your responsibility.
