info.title=Info
privacy.title=Privacy policy for Sewing Planner
privacy.date=Last updated: October 31, 2026
privacy.body=Controller and contact\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburg, Germany\nPrivacy: contact@appfabrik-ai.de\nSupport: support@appfabrik-ai.de\n\nPurpose and stored data\nSewing Planner manages your sewing projects. It stores the project name, material, color, storage location, notes, one optional photo and project status, together with the text, order and completion marks of your work steps. These data, internal record identifiers and your language preference are stored locally in your computer's user profile by default. Text and photos may contain personal information. Processing serves the management and search functions you request.\n\nLocal processing\nThe app requires no account or server. It does not send your data or language preference to the developer or other recipients. It contains no advertising, telemetry, usage analytics or built-in cloud synchronization. This policy is included in the app and works offline. The app does not itself encrypt its local data. Protection also depends on your user account, access permissions and any disk encryption you have enabled.\n\nPhotos and backups\nThe app reads only the JPEG or PNG image you select and stores a copy in its local database. It does not modify or delete the original file. Existing image metadata may remain in the stored copy. If you back up the data folder or store it in a synchronized folder or network location, those services may process data outside the app. Their settings and privacy terms apply. The app does not control these services.\n\nRetention and deletion\nData remain stored until you delete entries or remove the local app data. You can view, edit and delete entries in the app. To remove all local data, including photos and the language preference, close the app and remove its data folder. Storage locations are described in the included instructions. Original photos and backups must be deleted separately. Deleting an entry does not guarantee secure erasure of previous file contents. Do not rely on uninstalling the app to remove all app data and external copies.\n\nContact and support\nIf you voluntarily send us an email, we process your email address, message and attachments to handle your request. Your locally stored collection is not attached automatically. The legal basis for contract-related requests is Article 6(1)(b) GDPR. For other requests it is our legitimate interest in responding to inquiries under Article 6(1)(f) GDPR. We retain correspondence only as long as necessary to handle the request and meet statutory retention obligations.\n\nYour rights and other providers\nWhere applicable, you have rights of access, rectification, erasure, restriction of processing, data portability and objection, and the right to lodge a complaint with a data protection supervisory authority. Use the privacy contact above to exercise these rights. The developer has no access to collections stored only on your computer. When you obtain or update the app through Microsoft Store or GitHub, these providers may process data independently under their own privacy terms. This policy describes processing by Sewing Planner and will be updated when that processing changes.
