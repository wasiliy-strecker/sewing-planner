privacy.import=Collection import (including project status and checklist steps)\nThe app reads the JSON export you select and adds its entries, color values and photos to your local collection. Existing entries are preserved. Identical copies already present are skipped. The source file is not changed or transmitted. Imported photos retain any metadata contained in the export.
photoError.OPTIMIZE=The photo could not be optimized. Please choose another JPEG or PNG. Your current photo is unchanged.
privacy.photoOptimization=Optimization of new photos\nNewly selected or replaced photos are saved as a copy with a maximum edge of 1600 pixels, preserving the aspect ratio. Smaller images are not enlarged. Opaque images are saved as JPEG at quality 85%, transparent images as PNG. EXIF orientation is applied to the pixels. Source metadata such as camera and location information is not copied. The original file, existing stored photos and photos restored from JSON are unchanged.
