privacy.title=Política de privacidad de NähPlan
privacy.date=Actualizada el 31 de octubre de 2026
privacy.body=Responsable y contacto\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburgo, Alemania\nPrivacidad: contact@appfabrik-ai.de\nSoporte: support@appfabrik-ai.de\n\nFinalidad y datos guardados\nNähPlan gestiona tus proyectos de costura. Guarda el nombre del proyecto, el material, el color, la ubicación, las notas, una foto opcional y el estado del proyecto, además del texto, el orden y las marcas de finalización de los pasos de trabajo. Estos datos, los identificadores internos y tu preferencia de idioma se almacenan de forma predeterminada localmente en el perfil de usuario de tu ordenador. Los textos y las fotos pueden contener información personal. El tratamiento sirve para las funciones de gestión y búsqueda que solicitas.\n\nTratamiento local\nLa aplicación no necesita una cuenta ni un servidor. No envía tus datos ni tu preferencia de idioma al desarrollador ni a otros destinatarios. No contiene publicidad, telemetría, análisis de uso ni sincronización propia en la nube. Esta política está incluida en la aplicación y funciona sin conexión. La aplicación no cifra por sí misma los datos locales. La protección también depende de tu cuenta de usuario, los permisos de acceso y el cifrado del disco que hayas activado.\n\nFotos y copias de seguridad\nLa aplicación solo lee la imagen JPEG o PNG que seleccionas y guarda una copia en su base de datos local. No modifica ni elimina el archivo original. Los metadatos existentes de la imagen pueden conservarse en la copia. Si haces una copia de seguridad de la carpeta de datos o la guardas en una carpeta sincronizada o una unidad de red, esos servicios pueden tratar datos fuera de la aplicación. Se aplican sus ajustes y políticas de privacidad. La aplicación no controla esos servicios.\n\nConservación y eliminación\nLos datos se conservan hasta que eliminas las entradas o los datos locales de la aplicación. Puedes consultar, editar y eliminar las entradas en la aplicación. Para eliminar todos los datos locales, incluidas las fotos y la preferencia de idioma, cierra la aplicación y elimina su carpeta de datos. Las ubicaciones se describen en las instrucciones incluidas. Debes eliminar por separado las fotos originales y las copias de seguridad. Eliminar una entrada no garantiza el borrado seguro de contenidos anteriores. No confíes en que desinstalar la aplicación elimine todos sus datos y las copias externas.\n\nContacto y soporte\nSi nos envías voluntariamente un correo, tratamos tu dirección de correo electrónico, el mensaje y sus adjuntos para atender la consulta. Tu colección local no se adjunta automáticamente. La base jurídica para consultas relacionadas con un contrato es el artículo 6.1.b del RGPD. Para otras consultas es nuestro interés legítimo en responder, conforme al artículo 6.1.f del RGPD. Conservamos la correspondencia solo durante el tiempo necesario para atender la consulta y cumplir las obligaciones legales de conservación.\n\nTus derechos y otros proveedores\nCuando corresponda, tienes derecho de acceso, rectificación, supresión, limitación del tratamiento, portabilidad y oposición, así como a presentar una reclamación ante una autoridad de protección de datos. Puedes utilizar el contacto de privacidad indicado arriba. El desarrollador no tiene acceso a las colecciones que solo están en tu ordenador. Al obtener o actualizar la aplicación mediante Microsoft Store o GitHub, estos proveedores pueden tratar datos de forma independiente según sus propias condiciones. Esta política describe el tratamiento de NähPlan y se actualizará cuando cambie dicho tratamiento.
