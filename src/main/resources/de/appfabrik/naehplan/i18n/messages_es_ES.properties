backup.import.error.VERSION=Esta versión de exportación no es compatible. Tu colección no ha cambiado.
backup.import.error.LIMIT=La importación supera un límite: 256 MiB por archivo, 10.000 entradas, 1.048.576 caracteres por campo de texto o 10 MiB por foto. Un proyecto puede contener como máximo 10.000 pasos. No se han guardado ni exportado cambios.
backup.import.error.PHOTO=Una foto de la exportación no es válida o es demasiado grande. Tu colección no ha cambiado.
privacy.import=Importación de la colección (incluidos el estado del proyecto y los pasos de la lista)\nLa aplicación lee la exportación JSON que eliges y añade sus entradas, colores y fotos a tu colección local. Conserva las entradas existentes y omite las copias idénticas ya presentes. No modifica ni transmite el archivo de origen. Las fotos importadas conservan los metadatos incluidos en la exportación.
photoError.OPTIMIZE=No se ha podido optimizar la foto. Elige otro JPEG o PNG. Tu foto actual se conserva.
privacy.photoOptimization=Optimización de fotos nuevas\nLas fotos nuevas o sustituidas se guardan como copias con un lado máximo de 1600 píxeles, manteniendo las proporciones. Las imágenes más pequeñas no se amplían. Las imágenes opacas se guardan como JPEG con calidad del 85 % y las transparentes como PNG. La orientación EXIF se aplica a los píxeles. No se copian los metadatos del archivo original, como la cámara o la ubicación. El archivo original, las fotos ya guardadas y las restauradas desde JSON no se modifican.
limit.ENTRIES=La colección admite hasta 10.000 registros. Elimina un registro antes de añadir más. No se guardaron cambios.
limit.TEXT=Un campo supera 1.048.576 caracteres. Acórtalo antes de guardar o exportar. No se guardaron cambios ni se creó una exportación.
limit.FILE_SIZE=La exportación supera 256 MiB. No se creó ningún archivo. Cierra la app y copia naehplan.db para guardar una copia de toda la colección.
limit.STEPS=Un proyecto puede contener como máximo 10.000 pasos. No se han guardado ni exportado cambios.
