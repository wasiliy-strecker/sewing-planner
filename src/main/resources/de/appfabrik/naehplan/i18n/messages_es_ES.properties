privacy.export=Exportación de la colección (incluidos el estado del proyecto y los pasos de la lista)\nPuedes exportar todas las entradas guardadas, los valores de color seleccionados y las fotos a un archivo JSON en una ubicación elegida por ti. Las copias guardadas de las fotos se incluyen completas, con los metadatos que aún contengan. El archivo no está cifrado. La aplicación no lo sube ni lo envía. Si lo guardas en una carpeta de nube o red, su proveedor puede procesarlo. Compartir y eliminar las copias exportadas es tu responsabilidad.
photo.directoryNotSaved=Foto cargada. La carpeta solo se pudo recordar para esta sesión. Comprueba los permisos de escritura de la carpeta de datos de la aplicación.
privacy.photoDirectory=Carpeta de selección de fotos\nLa aplicación recuerda localmente la carpeta de la última foto seleccionada para abrir allí la siguiente selección, incluso después de reiniciar la aplicación. Solo se guarda la ruta de la carpeta en los datos de la aplicación. No se incluye en las exportaciones ni se transmite.
