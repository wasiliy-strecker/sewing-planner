privacy.title=Política de privacidade do NähPlan
privacy.date=Atualizada em 31 de outubro de 2026
privacy.body=Responsável e contato\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburg, Alemanha\nPrivacidade: contact@appfabrik-ai.de\nSuporte: support@appfabrik-ai.de\n\nFinalidade e dados salvos\nNähPlan organiza seus projetos de costura. São armazenados nome do projeto, material, cor, local de armazenamento, anotações, uma foto opcional e o status do projeto, além do texto, da ordem e das marcações de conclusão das etapas de trabalho. Esses dados, os identificadores internos e sua preferência de idioma ficam, por padrão, no perfil de usuário do seu computador. Textos e fotos podem conter informações pessoais. O tratamento atende às funções de organização e busca que você solicita.\n\nTratamento local\nO aplicativo não exige conta nem servidor. Ele não envia seus dados ou sua preferência de idioma ao desenvolvedor ou a outros destinatários. Não contém publicidade, telemetria, análise de uso nem sincronização própria na nuvem. Esta política está incluída no aplicativo e funciona offline. O aplicativo não criptografa seus dados locais por conta própria. A proteção também depende da conta de usuário, das permissões de acesso e da criptografia de disco que você tenha ativado.\n\nFotos e cópias de segurança\nO aplicativo lê apenas a imagem JPEG ou PNG escolhida por você e salva uma cópia no banco de dados local. Ele não modifica nem exclui o arquivo original. Metadados existentes da imagem podem permanecer na cópia salva. Se você fizer backup da pasta de dados ou a armazenar em uma pasta sincronizada ou unidade de rede, esses serviços poderão tratar dados fora do aplicativo. Aplicam-se as configurações e políticas de privacidade deles. O aplicativo não controla esses serviços.\n\nRetenção e exclusão\nOs dados permanecem salvos até você excluir os registros ou remover os dados locais do aplicativo. Você pode visualizar, editar e excluir registros no aplicativo. Para remover todos os dados locais, incluindo fotos e a preferência de idioma, feche o aplicativo e remova sua pasta de dados. Os locais estão descritos nas instruções incluídas. Fotos originais e backups precisam ser excluídos separadamente. Excluir um registro não garante a eliminação segura de conteúdos anteriores. Não presuma que desinstalar o aplicativo remova todos os dados e cópias externas.\n\nContato e suporte\nSe você nos enviar voluntariamente um e-mail, trataremos seu endereço de e-mail, a mensagem e os anexos para atender à solicitação. Sua coleção local não será anexada automaticamente. Para solicitações relacionadas a um contrato, a base legal é o artigo 6(1)(b) do RGPD europeu. Para outras solicitações, é nosso interesse legítimo em responder a consultas, conforme o artigo 6(1)(f) do RGPD. Mantemos a correspondência apenas pelo tempo necessário para atender à solicitação e cumprir obrigações legais de retenção.\n\nSeus direitos e outros provedores\nConforme a legislação aplicável, você tem direitos de acesso, retificação, exclusão, limitação do tratamento, portabilidade e oposição, além do direito de apresentar uma reclamação à autoridade de proteção de dados competente. Use o contato de privacidade acima. O desenvolvedor não tem acesso às coleções armazenadas somente no seu computador. Ao obter ou atualizar o aplicativo pelo Microsoft Store ou GitHub, esses provedores poderão tratar dados de forma independente, conforme suas próprias condições. Esta política descreve o tratamento pelo NähPlan e será atualizada quando esse tratamento mudar.
