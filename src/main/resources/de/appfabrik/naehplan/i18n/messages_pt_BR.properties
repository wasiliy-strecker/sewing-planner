privacy.export=Exportação da coleção (incluindo o status do projeto e as etapas da lista)\nVocê pode exportar todos os itens salvos, os valores das cores escolhidas e as fotos para um arquivo JSON no local que preferir. As cópias salvas das fotos são incluídas integralmente, com os metadados que ainda contêm. O arquivo não é criptografado. O aplicativo não faz upload nem envia o arquivo. Se você o salvar em uma pasta na nuvem ou na rede, o provedor poderá processá-lo. Compartilhar e excluir as cópias exportadas é sua responsabilidade.
photo.directoryNotSaved=Foto carregada. A pasta só pôde ser lembrada nesta sessão. Confira a permissão de gravação na pasta de dados do aplicativo.
privacy.photoDirectory=Pasta de seleção de fotos\nO aplicativo lembra localmente a pasta da última foto escolhida para abrir a próxima seleção nesse local, mesmo após reiniciar o aplicativo. Apenas o caminho da pasta é salvo nos dados do aplicativo. Ele não é incluído nas exportações nem transmitido.
