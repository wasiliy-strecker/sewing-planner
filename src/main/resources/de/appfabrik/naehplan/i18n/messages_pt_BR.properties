privacy.import=Importação da coleção (incluindo o status do projeto e as etapas da lista)\nO aplicativo lê a exportação JSON escolhida e adiciona os itens, as cores e as fotos à coleção local. Os itens existentes são preservados e as cópias idênticas já presentes são ignoradas. O arquivo original não é alterado nem transmitido. As fotos importadas mantêm os metadados incluídos na exportação.
photoError.OPTIMIZE=Não foi possível otimizar a foto. Escolha outro JPEG ou PNG. Sua foto atual será mantida.
privacy.photoOptimization=Otimização de novas fotos\nFotos recém-selecionadas ou substituídas são salvas como cópias com lado máximo de 1600 pixels, mantendo as proporções. Imagens menores não são ampliadas. Imagens opacas são salvas como JPEG com qualidade de 85%, e imagens transparentes como PNG. A orientação EXIF é aplicada aos pixels. Os metadados do arquivo original, como câmera e localização, não são copiados. O arquivo original, as fotos já salvas e as restauradas de JSON permanecem inalterados.
limit.ENTRIES=A coleção pode conter até 10.000 registros. Remova um registro antes de adicionar mais. Nenhuma alteração foi salva.
