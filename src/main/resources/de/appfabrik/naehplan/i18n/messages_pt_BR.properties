limit.FILE_SIZE=A exportação excede 256 MiB. Nenhum arquivo foi criado. Feche o aplicativo e copie naehplan.db para fazer uma cópia de toda a coleção.
limit.STEPS=Um projeto pode conter no máximo 10.000 etapas. Nenhuma alteração foi salva ou exportada.
