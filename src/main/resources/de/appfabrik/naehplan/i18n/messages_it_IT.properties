backup.import.title=Importa raccolta di progetti
backup.import.busy=Verifica e importazione della collezione …
backup.import.saved=Importate: {0,number,integer}. Già presenti: {1,number,integer}.
backup.import.failed=Impossibile completare l’importazione. La collezione non è cambiata. Riprova.
backup.import.error.READ=Impossibile leggere il file. Controlla il file e i permessi di accesso.
backup.import.error.FORMAT=Questo file non è un’esportazione valida di Sewing Planner. La collezione non è cambiata.
backup.import.error.VERSION=Questa versione di esportazione non è supportata. La collezione non è cambiata.
backup.import.error.LIMIT=L’importazione supera un limite: 256 MiB per file, 10.000 voci, 1.048.576 caratteri per campo di testo o 10 MiB per foto. Un progetto può contenere al massimo 10.000 passaggi. Nessuna modifica è stata salvata o esportata.
backup.import.error.PHOTO=Una foto nell’esportazione non è valida o è troppo grande. La collezione non è cambiata.
privacy.import=Importazione della collezione (inclusi lo stato del progetto e i passaggi della lista)\nL’app legge l’esportazione JSON scelta e aggiunge le voci, i colori e le foto alla collezione locale. Le voci esistenti vengono conservate e le copie identiche già presenti vengono ignorate. Il file originale non viene modificato né trasmesso. Le foto importate conservano i metadati inclusi nell’esportazione.
photoError.OPTIMIZE=Impossibile ottimizzare la foto. Scegli un altro JPEG o PNG. La foto attuale viene conservata.
privacy.photoOptimization=Ottimizzazione delle nuove foto\nLe foto appena scelte o sostituite vengono salvate come copie con un lato massimo di 1600 pixel, mantenendo le proporzioni. Le immagini più piccole non vengono ingrandite. Le immagini opache vengono salvate come JPEG con qualità dell’85 %, quelle trasparenti come PNG. L’orientamento EXIF viene applicato ai pixel. I metadati del file originale, come fotocamera e posizione, non vengono copiati. Il file originale, le foto già salvate e quelle ripristinate da JSON rimangono invariati.
limit.ENTRIES=La raccolta può contenere al massimo 10.000 voci. Elimina una voce prima di aggiungerne altre. Nessuna modifica è stata salvata.
limit.TEXT=Un campo supera 1.048.576 caratteri. Accorcialo prima di salvare o esportare. Non sono state salvate modifiche né creata un’esportazione.
limit.FILE_SIZE=L’esportazione supera 256 MiB. Nessun file è stato creato. Chiudi l’app e copia naehplan.db per salvare l’intera raccolta.
limit.STEPS=Un progetto può contenere al massimo 10.000 passaggi. Nessuna modifica è stata salvata o esportata.
