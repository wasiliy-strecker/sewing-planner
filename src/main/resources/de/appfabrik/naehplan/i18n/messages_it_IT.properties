backup.export.failed=Impossibile esportare la collezione. Controlla la cartella di destinazione, lo spazio libero e le foto salvate, quindi riprova.
privacy.export=Esportazione della collezione (inclusi lo stato del progetto e i passaggi della lista)\nPuoi esportare tutte le voci salvate, i valori dei colori scelti e le foto in un file JSON nella posizione che preferisci. Le copie salvate delle foto sono incluse integralmente, con gli eventuali metadati ancora presenti. Il file non è crittografato. L’app non lo carica né lo invia. Se lo salvi in una cartella cloud o di rete, il relativo fornitore può elaborarlo. La condivisione e l’eliminazione delle copie esportate sono di tua responsabilità.
photo.directoryNotSaved=Foto caricata. La cartella è stata memorizzata solo per questa sessione. Controlla i permessi di scrittura della cartella dei dati dell’app.
privacy.photoDirectory=Cartella di selezione delle foto\nL’app ricorda localmente la cartella dell’ultima foto selezionata per aprire lì la selezione successiva, anche dopo un riavvio. Viene salvato solo il percorso della cartella nei dati dell’app. Non viene incluso nelle esportazioni né trasmesso.
