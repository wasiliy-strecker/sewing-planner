backup.export.title=Exporter la collection de projets
backup.export.busy=Exportation de la collection avec les photos …
backup.export.saved={0,number,integer} entrées exportées vers {1}
backup.export.exists=Ce fichier existe déjà. Choisissez un nouveau nom pour l’exportation.
backup.export.failed=La collection n’a pas pu être exportée. Vérifiez le dossier de destination, l’espace libre et les photos enregistrées, puis réessayez.
privacy.export=Exportation de la collection (y compris l’état du projet et les étapes de la liste)\nVous pouvez exporter toutes les entrées enregistrées, les valeurs de couleur choisies et les photos dans un fichier JSON à l’emplacement de votre choix. Les copies enregistrées des photos sont incluses intégralement, avec les métadonnées qu’elles contiennent encore. Le fichier n’est pas chiffré. L’application ne le téléverse ni ne l’envoie. Si vous l’enregistrez dans un dossier cloud ou réseau, son fournisseur peut le traiter. Le partage et la suppression des copies exportées relèvent de votre responsabilité.
photo.directoryNotSaved=Photo chargée. Le dossier n’a pu être mémorisé que pour cette session. Vérifiez les droits d’écriture du dossier de données de l’application.
privacy.photoDirectory=Dossier de sélection des photos\nL’application mémorise localement le dossier de la dernière photo choisie pour y ouvrir la prochaine sélection, même après un redémarrage. Seul le chemin du dossier est enregistré dans les données de l’application. Il n’est ni inclus dans les exportations ni transmis.
backup.action.import=Importer
backup.import.title=Importer la collection de projets
backup.import.busy=Vérification et importation de la collection …
backup.import.saved=Importées : {0,number,integer}. Déjà présentes : {1,number,integer}.
backup.import.failed=L’importation n’a pas pu être terminée. Votre collection est inchangée. Veuillez réessayer.
backup.import.error.READ=Le fichier n’a pas pu être lu. Vérifiez le fichier et les droits d’accès.
backup.import.error.FORMAT=Ce fichier n’est pas une exportation valide de Sewing Planner. Votre collection est inchangée.
backup.import.error.VERSION=Cette version d’exportation n’est pas prise en charge. Votre collection est inchangée.
backup.import.error.LIMIT=L’importation dépasse une limite : 256 Mio par fichier, 10 000 entrées, 1 048 576 caractères par champ de texte ou 10 Mio par photo. Un projet peut contenir au maximum 10 000 étapes. Aucune modification n’a été enregistrée ou exportée.
backup.import.error.PHOTO=Une photo de l’exportation est invalide ou trop volumineuse. Votre collection est inchangée.
privacy.import=Importation de la collection (y compris l’état du projet et les étapes de la liste)\nL’application lit l’exportation JSON choisie et ajoute ses entrées, couleurs et photos à votre collection locale. Elle conserve les entrées existantes et ignore les copies identiques déjà présentes. Le fichier source n’est ni modifié ni transmis. Les photos importées conservent les métadonnées incluses dans l’exportation.
photoError.OPTIMIZE=Impossible d’optimiser la photo. Choisissez un autre JPEG ou PNG. Votre photo actuelle est conservée.
privacy.photoOptimization=Optimisation des nouvelles photos\nLes photos nouvellement choisies ou remplacées sont enregistrées sous forme de copies avec un côté maximal de 1600 pixels, en conservant les proportions. Les petites images ne sont pas agrandies. Les images opaques sont enregistrées en JPEG avec une qualité de 85 %, les images transparentes en PNG. L’orientation EXIF est appliquée aux pixels. Les métadonnées du fichier source, telles que l’appareil photo ou la localisation, ne sont pas copiées. Le fichier original, les photos déjà enregistrées et celles restaurées depuis JSON restent inchangés.
limit.ENTRIES=La collection peut contenir au maximum 10 000 entrées. Supprimez une entrée avant d’en ajouter. Aucune modification n’a été enregistrée.
limit.TEXT=Un champ dépasse 1 048 576 caractères. Raccourcissez-le avant d’enregistrer ou d’exporter. Aucune modification ni exportation n’a été enregistrée.
limit.FILE_SIZE=L’exportation dépasse 256 MiB. Aucun fichier n’a été créé. Fermez l’application et copiez naehplan.db pour sauvegarder toute la collection.
limit.STEPS=Un projet peut contenir au maximum 10 000 étapes. Aucune modification n’a été enregistrée ou exportée.
