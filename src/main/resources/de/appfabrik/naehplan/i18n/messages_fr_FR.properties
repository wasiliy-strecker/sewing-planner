privacy.title=Politique de confidentialité de NähPlan
privacy.date=Mise à jour le 31 octobre 2026
privacy.body=Responsable et contact\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsbourg, Allemagne\nConfidentialité : contact@appfabrik-ai.de\nAssistance : support@appfabrik-ai.de\n\nFinalités et données enregistrées\nNähPlan gère vos projets de couture. Les données enregistrées comprennent le nom du projet, le matériau, la couleur, l’emplacement, les notes, une photo facultative et l’état du projet, ainsi que le texte, l’ordre et les marques d’achèvement des étapes de travail. Ces données, les identifiants internes et votre préférence de langue sont conservés par défaut localement dans le profil utilisateur de votre ordinateur. Les textes et les photos peuvent contenir des données personnelles. Le traitement sert aux fonctions de gestion et de recherche que vous demandez.\n\nTraitement local\nL’application ne nécessite ni compte ni serveur. Elle ne transmet pas vos données ni votre préférence de langue au développeur ou à d’autres destinataires. Elle ne contient ni publicité, ni télémétrie, ni analyse d’utilisation, ni synchronisation propre dans le cloud. Cette politique est intégrée à l’application et fonctionne hors connexion. L’application ne chiffre pas elle-même ses données locales. Leur protection dépend aussi de votre compte utilisateur, des droits d’accès et d’un éventuel chiffrement du disque.\n\nPhotos et sauvegardes\nL’application lit uniquement l’image JPEG ou PNG que vous choisissez et en conserve une copie dans sa base de données locale. Elle ne modifie ni ne supprime le fichier original. Les métadonnées existantes peuvent rester présentes dans la copie. Si vous sauvegardez le dossier de données ou le placez dans un dossier synchronisé ou sur un lecteur réseau, ces services peuvent traiter des données en dehors de l’application. Leurs paramètres et règles de confidentialité s’appliquent. L’application ne contrôle pas ces services.\n\nConservation et suppression\nLes données restent enregistrées jusqu’à la suppression des entrées ou des données locales de l’application. Vous pouvez consulter, modifier et supprimer les entrées dans l’application. Pour supprimer toutes les données locales, y compris les photos et la préférence de langue, fermez l’application et supprimez son dossier de données. Les emplacements figurent dans les instructions fournies. Les photos originales et les sauvegardes doivent être supprimés séparément. La suppression d’une entrée ne garantit pas l’effacement sécurisé des anciens contenus. Ne supposez pas qu’une désinstallation supprime toutes les données et les copies externes.\n\nContact et assistance\nSi vous nous envoyez volontairement un e-mail, nous traitons votre adresse e-mail, le message et ses pièces jointes pour répondre à votre demande. Votre collection locale n’est pas jointe automatiquement. La base juridique est l’article 6, paragraphe 1, point b du RGPD pour les demandes liées à un contrat. Pour les autres demandes, il s’agit de notre intérêt légitime à répondre aux sollicitations selon l’article 6, paragraphe 1, point f du RGPD. Nous conservons la correspondance uniquement pendant la durée nécessaire au traitement et aux obligations légales de conservation.\n\nVos droits et autres fournisseurs\nSelon les dispositions applicables, vous disposez des droits d’accès, de rectification, d’effacement, de limitation du traitement, de portabilité et d’opposition, ainsi que du droit de déposer une réclamation auprès d’une autorité de protection des données. Utilisez le contact de confidentialité ci-dessus. Le développeur n’a pas accès aux collections stockées uniquement sur votre ordinateur. Lorsque vous obtenez ou mettez à jour l’application via Microsoft Store ou GitHub, ces fournisseurs peuvent traiter des données de manière indépendante selon leurs propres conditions. Cette politique décrit le traitement de NähPlan et sera actualisée si celui-ci change.
